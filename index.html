
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #7b2ff7, #f107a3, #ff8c42);
    color: white;
    text-align: center;
}

.container {
    padding: 35px 25px;
    margin: 20px;
    max-width: 550px;
    width: 90%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    backdrop-filter: blur(12px);
}

h1 {
    font-size: 32px;
}

p {
    font-size: 20px;
    line-height: 1.6;
}
</style>
</head>

<body>
    <div class="container">
        <h1>Привет! 👋</h1>
        <p>Вся информация нужная тебе будет снизу 👇</p>
    </div>
</body>
</html>
